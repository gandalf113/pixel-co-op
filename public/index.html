<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Co-op</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0a09; color: #e8e2d4; font-family: monospace; overflow: hidden; }
    #world { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #hud { position: absolute; left: 0; top: 0; pointer-events: none; display: block; }
    body.playing { cursor: none; }
    #ui { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .panel { pointer-events: auto; cursor: default; background: rgba(20, 18, 15, 0.94); border: 2px solid #5a4f44; padding: 24px 28px; min-width: 320px; max-width: 90vw; max-height: 94vh; overflow-y: auto; box-sizing: border-box; }
    .panel h1, .panel h2 { margin: 0 0 16px; color: #d9b53a; letter-spacing: 2px; }
    .panel label { display: block; margin: 12px 0 4px; color: #a39b8c; }
    .panel input[type=text] { font: inherit; font-size: 18px; width: 100%; box-sizing: border-box; padding: 6px 8px; background: #23211e; color: #e8e2d4; border: 1px solid #7d766b; }
    .panel input[type=range] { width: 100%; }
    .panel button { font: inherit; font-size: 16px; margin: 16px 8px 0 0; padding: 8px 18px; background: #b5652a; color: #14120f; border: 0; cursor: pointer; }
    .panel button:hover { background: #d9a877; }
    .panel ul { list-style: none; padding: 0; margin: 0; }
    .panel li { padding: 2px 0; }
    .panel table { border-collapse: collapse; margin-top: 8px; }
    .panel td, .panel th { padding: 2px 12px 2px 0; text-align: left; }
    .muted { color: #7d766b; }
    .panel button:disabled { background: #5a4f44; cursor: default; }
    .panel.lobby { width: min(1120px, 96vw); min-width: 0; padding: 18px 24px; }
    /* Pokoj: trzy kolumny u gory - gracze, trudnosc i CZAT. Czat w trzeciej kolumnie jest widoczny
       od razu, bez przewijania, a przycisk Start zostaje na dole tam, gdzie byl. */
    .lobby-top { display: grid; grid-template-columns: 1fr 1fr 1.15fr; gap: 20px; }
    @media (max-width: 900px) { .lobby-top { grid-template-columns: 1fr; } }
    .lobby-top label:first-child { margin-top: 0; }
    .ult-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
    @media (max-width: 900px) { .ult-row { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .panel .ult-tile { margin: 0; padding: 6px; text-align: center; background: #23211e; color: #e8e2d4; border: 2px solid #3b342d; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .panel .ult-tile:hover { background: #2e2a25; }
    .panel .ult-tile { position: relative; }
    .panel .ult-tile.sel { border-color: #6fe0ff; background: #1d2a2e; }
    .panel .ult-tile.sel2 { border-color: #d9b53a; background: #2a2416; }
    .slot-badge { position: absolute; top: 2px; left: 4px; font-size: 11px; font-weight: bold; color: #14120f; background: #6fe0ff; padding: 0 4px; }
    .slot-badge.two { background: #d9b53a; }
    .ult-icon { width: 96px; height: 96px; max-width: 100%; image-rendering: pixelated; }
    .ult-name { font-weight: bold; color: #d9b53a; }
    .ult-blurb { color: #a39b8c; font-size: 11px; }
    .ult-detail { min-height: 64px; margin-top: 8px; padding: 6px 10px; background: #1a1815; border: 1px solid #3b342d; font-size: 13px; }
    .ult-tier { color: #a39b8c; }
    .msg { color: #e8e2d4; font-size: 18px; }

    /* Czat pokoju: ramka jak sekcja POKOJE, lista rosnie w gore, pole zawsze na dole. */
    .card.chat { display: flex; flex-direction: column; min-height: 230px; border: 2px solid #5a4f44; padding: 8px 10px; }
    .card.chat .section-head .title { font-size: 15px; letter-spacing: 2px; }
    .chat-list { flex: 1; min-height: 120px; max-height: 240px; overflow-y: auto; margin: 6px 0; font-size: 13px; line-height: 1.45; display: flex; flex-direction: column; gap: 1px; }
    .chat-msg { word-break: break-word; }
    .chat-from { color: #d9b53a; font-weight: bold; }
    .chat-text { color: #e8e2d4; }
    .chat-msg.spect .chat-from { color: #6fe0ff; }
    .chat-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; background: #1d2a2e; color: #6fe0ff; border: 1px solid #38606b; padding: 0 4px; margin-right: 4px; }
    .chat-sys { color: #7d766b; font-style: italic; }
    .chat-form { display: flex; gap: 6px; }
    .panel input.chat-input { flex: 1; font-size: 14px; padding: 5px 7px; margin: 0; }
    .panel .chat-form button.small { margin: 0; }

    /* Wejscie do trwajacej gry jako widz. */
    .room-row .enter.watch { background: #38606b; color: #d8f6ff; }
    .room-row.watch:hover .enter.watch { background: #6fe0ff; color: #14120f; }

    /* Tryb widza: pasek u gory ekranu + czat w rogu, zeby bylo jasne, ze sie oglada, a nie gra. */
    #spect { position: absolute; left: 0; right: 0; top: 0; display: none; flex-direction: column; align-items: center; pointer-events: none; z-index: 5; }
    #spect.on { display: flex; }
    #spect .bar { margin-top: 8px; padding: 6px 16px; background: rgba(29, 42, 46, 0.92); border: 2px solid #6fe0ff; color: #d8f6ff; font-size: 14px; letter-spacing: 2px; font-weight: bold; }
    #spect .sub { margin-top: 4px; font-size: 12px; color: #a39b8c; background: rgba(14, 12, 10, 0.8); padding: 2px 8px; }

    /* Pole czatu w trakcie gry (Enter otwiera, Esc zamyka). Lista wiadomosci rysuje HUD na canvasie. */
    #gchat { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; display: none; z-index: 6; }
    #gchat.on { display: block; }
    #gchat input { font: inherit; font-size: 15px; width: min(560px, 90vw); padding: 7px 10px; background: rgba(20, 18, 15, 0.96); color: #e8e2d4; border: 2px solid #d9b53a; outline: none; }

    /* Przelacznik jezyka na ekranie nicku: dwa kafelki, wybrany podswietlony na zloto. */
    .lang-row { display: flex; align-items: center; gap: 6px; margin: 4px 0 2px; }
    .lang-row .lang-label { margin-right: 2px; }
    .panel button.lang-btn { margin: 0; padding: 5px 14px; font-size: 13px; letter-spacing: 1px; background: #23211e; color: #a39b8c; border: 2px solid #3b342d; }
    .panel button.lang-btn:hover { background: #2e2a25; color: #e8e2d4; }
    .panel button.lang-btn.sel { background: #d9b53a; color: #14120f; border-color: #ffe07a; font-weight: bold; }

    /* Baner u gory pokoju: co trzeba zrobic, zeby ruszyc. Ma byc widoczny od razu, nie do wyszukania. */
    /* Start po lewej, OPUSC POKOJ po prawej - zeby wyjscia nie dalo sie kliknac zamiast startu. */
    .lobby-actions { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .lobby-actions .wait { margin: 0; }
    .panel .lobby-actions button.leave { margin: 0 0 0 auto; background: #5e1a10; color: #ffd7d2; }
    .panel .lobby-actions button.leave:hover { background: #a8321f; color: #fff; }

    .lobby-banner { margin: 0 0 14px; padding: 10px 14px; text-align: center; background: #2a2416; border: 2px solid #d9b53a; color: #ffe07a; font-size: 18px; font-weight: bold; letter-spacing: 2px; }
    .panel.wide { min-width: 560px; }
    .panel input.code { text-transform: uppercase; letter-spacing: 4px; }
    .room-code { font-size: 28px; letter-spacing: 6px; color: #d9b53a; }
    .panel button.copy { font-size: 13px; padding: 4px 10px; margin-top: 6px; }
    .room-code-s { color: #d9b53a; letter-spacing: 3px; font-weight: bold; }
    .panel a.link { color: #a39b8c; text-decoration: underline; cursor: pointer; }
    canvas.controls-img { image-rendering: pixelated; max-width: 100%; height: auto; display: block; }
    .lb-wrap { margin-top: 18px; border-top: 1px solid #3b342d; padding-top: 10px; }
    .lb-tabs { display: flex; gap: 6px; margin-bottom: 6px; }
    .panel .lb-tab { margin: 0; padding: 3px 10px; font-size: 13px; background: #23211e; color: #a39b8c; }
    .panel .lb-tab.sel { background: #3b342d; color: #e8e2d4; }
    table.lb { width: 100%; font-size: 13px; }
    table.lb th { color: #a39b8c; font-weight: normal; }
    table.lb td, table.lb th { padding: 1px 10px 1px 0; }
    table.lb tr.me td { color: #d9b53a; }
    .lb-me { margin-top: 4px; }

    /* Ekran glowny (V3-K-06): arena w tle, panel polprzezroczysty, trzy kolumny, bestiariusz, stopka. */
    /* Ekran glowny B2 (V3-K-08): lewa kolumna = logo, wizytowka, GRAJ, leaderboard, stopka; prawa = POKOJE w zlotej ramce + bestiariusz. */
    .panel.home { width: min(1120px, 96vw); min-width: 0; padding: 14px 18px 12px; background: rgba(14, 12, 10, 0.86); display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: stretch; }
    @media (max-width: 900px) { .panel.home { grid-template-columns: 1fr; } }
    .home-left, .home-right { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .panel.home canvas.logo { display: block; margin: 0 auto 2px; image-rendering: pixelated; max-width: 100%; height: auto; }
    .card { background: rgba(26, 24, 21, 0.9); border: 1px solid #3b342d; padding: 10px 12px; }
    .card.me { text-align: center; }
    .card.me .hero { height: 64px; display: flex; align-items: center; justify-content: center; }
    .card.me .hero-img { image-rendering: pixelated; }
    .card.me .nick { font-size: 20px; font-weight: bold; letter-spacing: 1px; margin-top: 2px; }
    .card.me .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 8px 0 0; }
    .card.me .stat b { display: block; font-size: 18px; color: #e8e2d4; }
    .card.me .stat span { font-size: 11px; }
    .panel button.small { font-size: 13px; padding: 4px 10px; margin: 0; }
    .panel button.big { display: block; width: 100%; margin: 0 0 4px; padding: 12px; font-size: 26px; letter-spacing: 6px; font-weight: bold; background: #d9b53a; box-shadow: 0 4px 0 #8c6a1e; }
    .panel button.big:hover { background: #ffe07a; }
    .panel button.big:active { transform: translateY(3px); box-shadow: 0 1px 0 #8c6a1e; }
    .play .row { display: flex; gap: 8px; margin-top: 8px; }
    .play .row button { flex: 1; margin: 0; }
    .play .small { font-size: 11px; }
    .play .center { text-align: center; }
    .play .note { min-height: 1.2em; margin-top: 6px; font-size: 12px; }
    .play .settings { margin-top: 8px; padding: 8px 10px; background: rgba(26, 24, 21, 0.9); border: 1px solid #3b342d; }
    .play .settings label { margin: 4px 0 2px; font-size: 12px; }
    .play .settings button.small { margin-top: 6px; }
    .card.board { flex: 1; }
    .card.board .lb-wrap { margin-top: 0; border-top: 0; padding-top: 0; }
    .rooms-section { flex: 1; border: 2px solid #d9b53a; display: flex; flex-direction: column; }
    .section-head { display: flex; align-items: center; gap: 10px; }
    .section-head .title { color: #d9b53a; font-weight: bold; font-size: 18px; letter-spacing: 3px; }
    .section-head .rule { flex: 1; height: 1px; background: #5a4f44; }
    .section-head .count { font-size: 12px; white-space: nowrap; }
    .panel ul.rooms { margin: 10px 0 0; min-width: 0; max-height: 330px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; }
    @media (max-width: 700px) { .panel ul.rooms { grid-template-columns: 1fr; } }
    .panel ul.rooms > li.muted { grid-column: 1 / -1; }
    .room-row { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; border: 1px solid #3b342d; margin: 0; color: #7d766b; }
    .room-row.join { color: #e8e2d4; cursor: pointer; background: #23211e; }
    .room-row.join:hover { background: #2e2a25; border-color: #b5652a; }
    .room-row .room-top { display: flex; align-items: center; gap: 8px; }
    .room-row .spacer { flex: 1; }
    .room-row .slots { display: flex; gap: 3px; }
    .room-row .slot { width: 22px; height: 22px; border: 1px dashed #4a4238; display: flex; align-items: center; justify-content: center; }
    .room-row .slot.taken { border-style: solid; background: #14120f; }
    .room-row .slot-img { image-rendering: pixelated; width: 16px; height: 16px; }
    .room-row .room-info { font-size: 11px; }
    .room-row .enter { font-size: 12px; padding: 2px 8px; background: #b5652a; color: #14120f; font-weight: bold; }
    .room-row.join:hover .enter { background: #d9a877; }
    .room-row .badge { font-size: 11px; padding: 1px 6px; background: #5e1a10; color: #ffd7d2; }
    .beast-card label { margin: 0 0 4px; }
    .bestiary { display: flex; gap: 4px; flex-wrap: wrap; }
    .beast { width: 66px; text-align: center; padding: 4px 2px; border: 1px solid transparent; cursor: default; }
    .beast:hover { border-color: #5a4f44; background: #1d1a16; }
    .beast-img { image-rendering: pixelated; height: 32px; width: auto; }
    .beast-name { font-size: 11px; color: #a39b8c; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .blurb { min-height: 1.3em; font-size: 12px; margin-top: 2px; }
    /* Stopka: porada, puls serwera i "co nowego" JEDNO POD DRUGIM. Dwie kolumny wciskaly porade
       i MOTD w kilkunastopikselowy pasek obok "online · pokoje · wersja". */
    .home-foot { margin-top: auto; border-top: 1px solid #3b342d; padding-top: 6px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; align-items: stretch; }
    .home-foot .tip { color: #d9a877; }
    .home-foot .tip::before { content: '» '; color: #7d766b; }
    .home-foot .news { color: #a39b8c; font-size: 12px; }
    .home-foot .news div { margin: 2px 0; }
    .home-foot .news b { color: #d9b53a; }

    /* Poligon (V3-K-07): panel po prawej, scena z gry zostaje widoczna po lewej. */
    #ui.side { justify-content: flex-end; align-items: stretch; }
    .panel.range { width: 420px; max-width: 46vw; max-height: none; background: rgba(14, 12, 10, 0.9); border-right: 0; display: flex; flex-direction: column; justify-content: center; }
    .panel.range p { margin: 0 0 10px; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="world" width="480" height="270"></canvas>
  <canvas id="hud"></canvas>
  <div id="ui"></div>
  <div id="spect"><div class="bar"></div><div class="sub"></div></div>
  <div id="gchat"><input type="text" maxlength="160"></div>
  <script type="module" src="/client/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAN Co-op</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0a09; color: #e8e2d4; font-family: monospace; overflow: hidden; }
    #world { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #hud { position: absolute; left: 0; top: 0; pointer-events: none; }
    body.playing { cursor: none; }
    #ui { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .panel { pointer-events: auto; cursor: default; background: rgba(20, 18, 15, 0.94); border: 2px solid #5a4f44; padding: 24px 28px; min-width: 320px; max-width: 90vw; max-height: 94vh; overflow-y: auto; box-sizing: border-box; }
    .panel h1, .panel h2 { margin: 0 0 16px; color: #d9b53a; letter-spacing: 2px; }
    .panel label { display: block; margin: 12px 0 4px; color: #a39b8c; }
    .panel input[type=text] { font: inherit; font-size: 18px; width: 100%; box-sizing: border-box; padding: 6px 8px; background: #23211e; color: #e8e2d4; border: 1px solid #7d766b; }
    .panel input[type=range] { width: 100%; }
    .panel button { font: inherit; font-size: 16px; margin: 16px 8px 0 0; padding: 8px 18px; background: #b5652a; color: #14120f; border: 0; cursor: pointer; }
    .panel button:hover { background: #d9a877; }
    .panel ul { list-style: none; padding: 0; margin: 0; }
    .panel li { padding: 2px 0; }
    .panel table { border-collapse: collapse; margin-top: 8px; }
    .panel td, .panel th { padding: 2px 12px 2px 0; text-align: left; }
    .muted { color: #7d766b; }
    .panel button:disabled { background: #5a4f44; cursor: default; }
    .panel.lobby { width: min(1120px, 96vw); min-width: 0; padding: 18px 24px; }
    .lobby-top { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .lobby-top label:first-child { margin-top: 0; }
    .ult-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
    @media (max-width: 900px) { .ult-row { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .panel .ult-tile { margin: 0; padding: 6px; text-align: center; background: #23211e; color: #e8e2d4; border: 2px solid #3b342d; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .panel .ult-tile:hover { background: #2e2a25; }
    .panel .ult-tile.sel { border-color: #6fe0ff; background: #1d2a2e; }
    .ult-icon { width: 96px; height: 96px; max-width: 100%; image-rendering: pixelated; }
    .ult-name { font-weight: bold; color: #d9b53a; }
    .ult-blurb { color: #a39b8c; font-size: 11px; }
    .ult-detail { min-height: 64px; margin-top: 8px; padding: 6px 10px; background: #1a1815; border: 1px solid #3b342d; font-size: 13px; }
    .ult-tier { color: #a39b8c; }
    .msg { color: #e8e2d4; font-size: 18px; }
  </style>
</head>
<body>
  <canvas id="world" width="480" height="270"></canvas>
  <canvas id="hud"></canvas>
  <div id="ui"></div>
  <script type="module" src="/client/main.js"></script>
</body>
</html>
